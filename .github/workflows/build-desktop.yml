name: Build Windows and Linux Desktop Apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk xvfb
          /usr/bin/python3 -m venv .venv-build
          echo "$PWD/.venv-build/bin" >> "$GITHUB_PATH"
      - name: Install build dependencies
        run: python -m pip install pyinstaller==6.22.0 pillow==11.3.0 keyring==25.6.0
      - name: Test core and platform behavior
        run: python -m unittest discover -s tests
      - name: Build and smoke-test Windows GUI
        if: runner.os == 'Windows'
        run: python dev/build_desktop.py
      - name: Build and smoke-test Linux GUI
        if: runner.os == 'Linux'
        run: xvfb-run -a python dev/build_desktop.py
      - name: Upload packages and smoke-test report
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dev/dist/*.zip
            dev/dist/*.tar.gz
            dev/dist/*.deb
            dev/dist/checksums_*.txt
            dev/dist/gui-smoke.json
          if-no-files-found: error
